[pytest]

# --- Tham số dòng lệnh tự động thêm vào mỗi lần chạy pytest ---
addopts =
    --html=reports/report.html
    --self-contained-html
    --tb=short
    -v

# --- Thư mục chứa bài test ---
testpaths = tests

# --- Cấu hình hiển thị Log trực tiếp trên Terminal (Console) ---
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)-8s] %(name)s — %(message)s
log_cli_date_format = %H:%M:%S

# --- Cấu hình xuất Log ra file (lưu vết chạy test) ---
log_file = reports/test_run.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# --- Tự định nghĩa các marker (Phân loại test để chạy riêng lẻ) ---
# Ví dụ chạy: pytest -m smoke
markers =
    smoke: Bộ test cơ bản chạy nhanh để kiểm tra tính khả dụng của hệ thống
    regression: Bộ test hồi quy toàn diện
    slow: Các test chạy lâu (cần chờ đợi timeout, animation)
    flaky: Các test có khả năng không ổn định do mạng hoặc UI

# --- Bỏ qua các thư mục không chứa file test ---
# (Rất quan trọng: bỏ qua thư mục 'pages' để tránh cảnh báo pytest collection)
norecursedirs = .git __pycache__ .pytest_cache node_modules venv .venv pages screenshots reports

# --- Tắt các cảnh báo (Warnings) không cần thiết ---
filterwarnings =
    ignore::pytest.PytestCollectionWarning

# --- Định nghĩa đường dẫn gốc (Root Path) ---
# Giúp import các file từ thư mục gốc (như pages/, screenshot_utility) dễ dàng hơn
pythonpath = .
